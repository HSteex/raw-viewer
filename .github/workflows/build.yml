name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore di firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Nessun KEYSTORE_B64: la release viene firmata con la chiave di debug"
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/raw-viewer.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: raw-viewer-apk
          path: out/*.apk

      # Ogni build su main aggiorna la release "latest": l'APK si scarica direttamente dal telefono.
      - name: Pubblica release "latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk \
            --title "RAW Viewer build ${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }} da ${{ github.sha }}. Link fisso: https://github.com/${{ github.repository }}/releases/latest/download/raw-viewer.apk" \
            --target "${{ github.sha }}" \
            --latest
